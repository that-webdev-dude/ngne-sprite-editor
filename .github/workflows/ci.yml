name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check
            # Software WebGPU as in NGNE's own CI: headed Chrome under xvfb with SwiftShader.
            - name: Install software WebGPU presentation dependencies
              run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers xvfb xauth
            - name: End-to-end tests
              env:
                  E2E_HEADLESS: 0
              run: xvfb-run -a npm run test:e2e
            - name: Upload end-to-end artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-results
                  path: test-results
                  if-no-files-found: ignore
